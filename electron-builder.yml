appId: com.example.spoti
productName: SpotI
directories:
  output: release
  buildResources: assets
files:
  - dist/**
win:
  target:
    - nsis
    - portable
  artifactName: "${productName}-${version}-${target}.${ext}"
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
asar: true
publish: null
