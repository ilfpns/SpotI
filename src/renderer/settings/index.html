<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Settings</title>
    <link rel="stylesheet" href="./settings.css" />
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <div class="brand">
          <div id="brand-icon" class="brand-icon"></div>
          <div class="brand-name">SpotI</div>
        </div>
        <nav class="nav">
          <button class="nav-item active" data-page="general">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M12 15.5a3.5 3.5 0 100-7 3.5 3.5 0 000 7zm7.94-3.5a7.97 7.97 0 00-.18-1.6l1.92-1.5a.5.5 0 00.12-.64l-1.8-3.12a.5.5 0 00-.6-.22l-2.26.91a7.9 7.9 0 00-1.38-.8L15.4 1.5a.5.5 0 00-.5-.42h-3.6a.5.5 0 00-.5.42l-.36 2.53c-.5.2-.96.48-1.38.8l-2.26-.91a.5.5 0 00-.6.22L4.2 7.26a.5.5 0 00.12.64l1.92 1.5c-.08.52-.14 1.06-.14 1.6s.06 1.08.14 1.6l-1.92 1.5a.5.5 0 00-.12.64l1.8 3.12c.14.24.42.32.6.22l2.26-.91c.42.32.88.6 1.38.8l.36 2.53c.04.24.26.42.5.42h3.6c.24 0 .46-.18.5-.42l.36-2.53c.5-.2.96-.48 1.38-.8l2.26.91c.24.1.46 0 .6-.22l1.8-3.12a.5.5 0 00-.12-.64l-1.92-1.5c.08-.52.18-1.06.18-1.6z"
              />
            </svg>
            <span data-i18n="nav.general"></span>
          </button>
          <button class="nav-item" data-page="theme">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M12 2a10 10 0 100 20c1.1 0 2-.9 2-2 0-.5-.2-.95-.52-1.29-.3-.32-.48-.75-.48-1.21 0-1.1.9-2 2-2h2.36A5.64 5.64 0 0022 10c0-4.42-4.48-8-10-8zM6.5 12a1.5 1.5 0 110-3 1.5 1.5 0 010 3zm3-4a1.5 1.5 0 110-3 1.5 1.5 0 010 3zm5 0a1.5 1.5 0 110-3 1.5 1.5 0 010 3zm3 4a1.5 1.5 0 110-3 1.5 1.5 0 010 3z"
              />
            </svg>
            <span data-i18n="nav.theme"></span>
          </button>
          <button class="nav-item" data-page="case">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor">
              <path d="M4 4a2 2 0 00-2 2v12a2 2 0 002 2h9a2 2 0 002-2V6a2 2 0 00-2-2H4zm9 2v12H4V6h9zM16 9h4v10h-4V9z" />
            </svg>
            <span data-i18n="nav.case"></span>
          </button>
          <button class="nav-item" data-page="animation">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46A7.93 7.93 0 0020 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74A7.93 7.93 0 004 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"
              />
            </svg>
            <span data-i18n="nav.animation"></span>
          </button>
          <button class="nav-item" data-page="history">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M4 4h4v4H4V4zm6 0h4v4h-4V4zm6 0h4v4h-4V4zM4 10h4v4H4v-4zm6 0h4v4h-4v-4zm6 0h4v4h-4v-4zM4 16h4v4H4v-4zm6 0h4v4h-4v-4z"
              />
            </svg>
            <span data-i18n="nav.history"></span>
          </button>
          <button class="nav-item" data-page="favorite">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M12 20.5s-7.5-4.6-10-9.3C.5 7.8 2.4 4.5 6 4.5c2.1 0 3.6 1.1 4.5 2.6.4.7 1.6.7 2 0C13.4 5.6 14.9 4.5 17 4.5c3.6 0 5.5 3.3 4 6.7-2.5 4.7-10 9.3-10 9.3z"
              />
            </svg>
            <span data-i18n="nav.favorite"></span>
          </button>
          <button class="nav-item" data-page="spotify">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M12 2a10 10 0 100 20 10 10 0 000-20zm4.59 14.4a.62.62 0 01-.86.21c-2.36-1.44-5.33-1.77-8.83-.97a.63.63 0 01-.28-1.22c3.83-.87 7.12-.5 9.76 1.11.3.18.4.57.21.87zm1.22-2.72a.78.78 0 01-1.07.26c-2.7-1.66-6.82-2.14-10.02-1.17a.78.78 0 11-.45-1.49c3.65-1.1 8.19-.57 11.29 1.33.37.23.48.72.25 1.07zm.1-2.83c-3.24-1.92-8.6-2.1-11.7-1.16a.94.94 0 11-.54-1.79c3.56-1.08 9.47-.87 13.2 1.34a.94.94 0 01-.96 1.61z"
              />
            </svg>
            <span data-i18n="nav.spotify"></span>
          </button>
        </nav>
      </aside>

      <main class="content">
        <section class="page" data-page="general">
          <h1 data-i18n="page.general.title"></h1>

          <div class="card">
            <div class="card-title" data-i18n="card.language.title"></div>
            <div class="card-desc" data-i18n="card.language.desc"></div>
            <div id="language-select" class="select">
              <button class="select-trigger" type="button">
                <span class="select-trigger-label"></span>
                <svg class="select-chevron" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M7 10l5 5 5-5z" />
                </svg>
              </button>
              <div class="select-menu"></div>
            </div>
          </div>

          <div class="card">
            <div class="card-title" data-i18n="card.volume.title"></div>
            <div class="card-desc" data-i18n="card.volume.desc"></div>
            <div class="volume-row">
              <svg class="volume-icon" viewBox="0 0 24 24" fill="currentColor">
                <path
                  d="M3 10v4h4l5 5V5L7 10H3zm13.5 2A4.5 4.5 0 0014 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"
                />
              </svg>
              <input id="volume-slider" type="range" min="0" max="100" value="50" />
              <span id="volume-value" class="volume-value">50%</span>
            </div>
            <div id="volume-error" class="settings-error" hidden></div>
          </div>

          <div class="card">
            <div class="row">
              <div class="row-text">
                <div class="row-title" data-i18n="card.autoLaunch.title"></div>
                <div class="row-desc" data-i18n="card.autoLaunch.desc"></div>
              </div>
              <div id="auto-launch-toggle"></div>
            </div>
          </div>

          <div class="card">
            <div class="card-title" data-i18n="card.petSize.title"></div>
            <div class="card-desc" data-i18n="card.petSize.desc"></div>
            <div id="pet-size-segmented" class="segmented"></div>
          </div>

          <div class="card">
            <div class="card-title" data-i18n="card.opacity.title"></div>
            <div class="card-desc" data-i18n="card.opacity.desc"></div>
            <div class="volume-row">
              <svg class="volume-icon" viewBox="0 0 24 24" fill="currentColor">
                <path
                  d="M12 2C8 6 4 10.5 4 14.5 4 18.6 7.6 22 12 22s8-3.4 8-7.5C20 10.5 16 6 12 2z"
                />
              </svg>
              <input id="opacity-slider" type="range" min="20" max="100" value="100" />
              <span id="opacity-value" class="volume-value">100%</span>
            </div>
          </div>

          <div class="card">
            <div class="row">
              <div class="row-text">
                <div class="row-title" data-i18n="card.notify.title"></div>
                <div class="row-desc" data-i18n="card.notify.desc"></div>
              </div>
              <div id="notify-toggle"></div>
            </div>
          </div>

          <div class="card">
            <div class="card-title" data-i18n="card.pollingSpeed.title"></div>
            <div class="card-desc" data-i18n="card.pollingSpeed.desc"></div>
            <div id="polling-speed-segmented" class="segmented"></div>
          </div>

          <div class="card">
            <div class="card-title" data-i18n="card.hoverDelay.title"></div>
            <div class="card-desc" data-i18n="card.hoverDelay.desc"></div>
            <div id="hover-delay-segmented" class="segmented"></div>
          </div>

          <div class="card">
            <div class="row">
              <div class="row-text">
                <div class="row-title" data-i18n="card.spinAnimation.title"></div>
                <div class="row-desc" data-i18n="card.spinAnimation.desc"></div>
              </div>
              <div id="spin-animation-toggle"></div>
            </div>
          </div>

          <div class="card">
            <div class="row">
              <div class="row-text">
                <div class="row-title" data-i18n="card.mediaKeys.title"></div>
                <div class="row-desc" data-i18n="card.mediaKeys.desc"></div>
              </div>
              <div id="media-keys-toggle"></div>
            </div>
          </div>

          <div class="card">
            <div class="row">
              <div class="row-text">
                <div class="row-title" data-i18n="card.notificationSound.title"></div>
                <div class="row-desc" data-i18n="card.notificationSound.desc"></div>
              </div>
              <div id="notification-sound-toggle"></div>
            </div>
          </div>

          <div class="card">
            <div class="row">
              <div class="row-text">
                <div class="row-title" data-i18n="card.startHidden.title"></div>
                <div class="row-desc" data-i18n="card.startHidden.desc"></div>
              </div>
              <div id="start-hidden-toggle"></div>
            </div>
          </div>

          <div class="card">
            <div class="row">
              <div class="row-text">
                <div class="row-title" data-i18n="card.reset.title"></div>
                <div class="row-desc" data-i18n="card.reset.desc"></div>
              </div>
              <button id="reset-settings-button" class="danger-button" data-i18n="button.reset"></button>
            </div>
          </div>
        </section>

        <section class="page" data-page="theme" hidden>
          <h1 data-i18n="page.theme.title"></h1>

          <div class="card">
            <div class="card-title" data-i18n="card.uiTheme.title"></div>
            <div class="card-desc" data-i18n="card.uiTheme.desc"></div>
            <div id="ui-theme-segmented" class="segmented"></div>
          </div>

          <div class="card">
            <div class="card-title" data-i18n="card.fontColor.title"></div>
            <div class="card-desc" data-i18n="card.fontColor.desc"></div>
            <div class="swatch-row">
              <div id="font-color-presets" class="swatch-list"></div>
              <label class="color-wheel-button" title="Custom color">
                <input id="font-color-wheel-input" type="color" />
              </label>
            </div>
          </div>

          <div class="card">
            <div class="card-title" data-i18n="card.labelColor.title"></div>
            <div class="card-desc" data-i18n="card.labelColor.desc"></div>
            <div class="swatch-row">
              <div id="label-color-presets" class="swatch-list"></div>
              <label class="color-wheel-button" title="Custom color">
                <input id="label-color-wheel-input" type="color" />
              </label>
            </div>
            <div class="row" style="margin-top: 14px">
              <div class="row-text">
                <div class="row-title" data-i18n="card.followNowPlaying.title"></div>
                <div class="row-desc" data-i18n="card.followNowPlaying.desc"></div>
              </div>
              <div id="follow-now-playing-toggle"></div>
            </div>
          </div>

          <div class="card">
            <div class="row">
              <div class="row-text">
                <div class="row-title" data-i18n="card.border.title"></div>
                <div class="row-desc" data-i18n="card.border.desc"></div>
              </div>
              <div id="border-toggle"></div>
            </div>
            <div class="swatch-row" style="margin-top: 14px">
              <div id="border-color-presets" class="swatch-list"></div>
              <label class="color-wheel-button" title="Custom color">
                <input id="border-color-wheel-input" type="color" />
              </label>
            </div>
          </div>
        </section>

        <section class="page" data-page="case" hidden>
          <h1 data-i18n="page.case.title"></h1>

          <div class="card">
            <div class="card-title" data-i18n="card.caseShape.title"></div>
            <div class="card-desc" data-i18n="card.caseShape.desc"></div>
            <div id="case-shape-segmented" class="segmented"></div>
          </div>

          <div class="card">
            <div class="card-title" data-i18n="card.caseColor.title"></div>
            <div class="card-desc" data-i18n="card.caseColor.desc"></div>
            <div class="swatch-row">
              <div id="case-color-presets" class="swatch-list"></div>
              <label class="color-wheel-button" title="Custom color">
                <input id="case-color-wheel-input" type="color" />
              </label>
            </div>
          </div>

          <div class="card">
            <div class="card-title" data-i18n="card.discName.title"></div>
            <div class="card-desc" data-i18n="card.discName.desc"></div>
            <input id="disc-name-input" type="text" class="text-input" maxlength="7" placeholder="SPOTI" />
          </div>
        </section>

        <section class="page" data-page="animation" hidden>
          <h1 data-i18n="page.animation.title"></h1>

          <div class="card">
            <div class="card-title" data-i18n="card.caseSlideSpeed.title"></div>
            <div class="card-desc" data-i18n="card.caseSlideSpeed.desc"></div>
            <div id="case-slide-speed-segmented" class="segmented"></div>
          </div>

          <div class="card">
            <div class="card-title" data-i18n="card.discSpinSpeed.title"></div>
            <div class="card-desc" data-i18n="card.discSpinSpeed.desc"></div>
            <div id="disc-spin-speed-segmented" class="segmented"></div>
          </div>
        </section>

        <section class="page" data-page="history" hidden>
          <h1 data-i18n="page.history.title"></h1>

          <div class="card history-summary-card">
            <div class="history-summary-grid">
              <div class="history-stat">
                <div id="history-total" class="history-stat-value"></div>
                <div class="history-stat-label" data-i18n="history.total"></div>
              </div>
              <div class="history-stat">
                <div id="history-week" class="history-stat-value"></div>
                <div class="history-stat-label" data-i18n="history.thisWeek"></div>
              </div>
              <div class="history-stat">
                <div id="history-best-day" class="history-stat-value"></div>
                <div class="history-stat-label" data-i18n="history.bestDay"></div>
              </div>
              <div class="history-stat">
                <div id="history-average" class="history-stat-value"></div>
                <div class="history-stat-label" data-i18n="history.average"></div>
              </div>
              <div class="history-stat">
                <div id="history-play-count" class="history-stat-value"></div>
                <div class="history-stat-label" data-i18n="history.playCount"></div>
              </div>
            </div>
            <div class="history-streaks">
              <div class="history-stat">
                <div id="history-longest-streak" class="history-stat-value"></div>
                <div class="history-stat-label" data-i18n="history.longestStreak"></div>
              </div>
              <div class="history-stat">
                <div id="history-current-streak" class="history-stat-value"></div>
                <div class="history-stat-label" data-i18n="history.currentStreak"></div>
              </div>
            </div>
          </div>

          <div class="card history-heatmap-card">
            <div class="history-heatmap-header">
              <div class="card-title" data-i18n="history.heatmap.title"></div>
              <div id="history-year-select" class="select select-compact">
                <button class="select-trigger" type="button">
                  <span class="select-trigger-label"></span>
                  <svg class="select-chevron" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M7 10l5 5 5-5z" />
                  </svg>
                </button>
                <div class="select-menu"></div>
              </div>
            </div>

            <div class="heatmap-2d-row">
              <div class="heatmap-weekdays">
                <span></span>
                <span data-i18n="weekday.mon"></span>
                <span></span>
                <span data-i18n="weekday.wed"></span>
                <span></span>
                <span data-i18n="weekday.fri"></span>
                <span></span>
              </div>
              <div class="heatmap-2d-scroll">
                <div id="history-heatmap-2d" class="heatmap-2d"></div>
              </div>
            </div>

            <div class="heatmap-legend">
              <span data-i18n="history.less"></span>
              <span class="legend-swatch" style="background: var(--heat-0)"></span>
              <span class="legend-swatch" style="background: var(--heat-1)"></span>
              <span class="legend-swatch" style="background: var(--heat-2)"></span>
              <span class="legend-swatch" style="background: var(--heat-3)"></span>
              <span class="legend-swatch" style="background: var(--heat-4)"></span>
              <span data-i18n="history.more"></span>
            </div>
          </div>

          <div class="card">
            <div id="history-best-track-title" class="card-title"></div>
            <div id="history-best-track" class="history-best-track"></div>
          </div>
        </section>

        <section class="page" data-page="favorite" hidden>
          <h1 data-i18n="page.favorite.title"></h1>

          <div class="card">
            <div id="favorite-list" class="favorite-list"></div>
            <div id="favorite-empty" class="card-desc" data-i18n="favorite.empty" hidden></div>
            <button id="favorite-load-more" class="secondary-button" data-i18n="favorite.loadMore" hidden></button>
          </div>
        </section>

        <section class="page" data-page="spotify" hidden>
          <h1 data-i18n="page.spotify.title"></h1>

          <div class="card">
            <div class="card-title" data-i18n="card.clientId.title"></div>
            <div class="card-desc" data-i18n="card.clientId.desc"></div>
            <div class="row" style="gap: 8px">
              <input id="client-id-input" type="text" class="text-input" placeholder="Client ID" />
              <button id="client-id-save-button" class="spotify-button" data-i18n="button.save"></button>
            </div>
            <div id="client-id-status" class="card-desc" style="margin-top: 8px; margin-bottom: 0"></div>
            <div class="card-desc" style="margin-top: 12px; margin-bottom: 6px">
              <span data-i18n="card.clientId.redirectLabel"></span>:
              <code id="redirect-uri-value" class="code-value"></code>
            </div>
            <button id="open-dashboard-button" class="spotify-button" data-i18n="button.openDashboard"></button>
          </div>

          <div class="card">
            <div class="row">
              <div class="row-text">
                <div class="card-title" data-i18n="card.spotify.title"></div>
                <div id="spotify-status" class="card-desc">…</div>
              </div>
              <button id="spotify-action" class="danger-button" hidden></button>
            </div>
          </div>

          <div class="card">
            <div class="card-title" data-i18n="card.version.title"></div>
            <div class="card-desc" data-i18n="app.description"></div>
            <div class="info-rows">
              <div class="info-row">
                <div class="info-row-label" data-i18n="label.version"></div>
                <div class="info-row-value">v0.1.0</div>
              </div>
              <div class="info-row">
                <div class="info-row-label" data-i18n="label.runtime"></div>
                <div id="runtime-info" class="info-row-value"></div>
              </div>
            </div>
            <div class="row" style="margin-top: 14px">
              <div id="update-status" class="card-desc" style="margin-bottom: 0"></div>
              <button id="check-update-button" class="secondary-button" data-i18n="button.checkUpdate"></button>
            </div>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
