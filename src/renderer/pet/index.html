<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>SpotI</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      #pet-root,
      #pet-root svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      /* Click the pet to slide the sleeve (and its printed name) fully off,
         revealing the whole LP — click again to slide it back on. */
      #pet-case-group {
        transition: transform 320ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      #pet-root.revealed #pet-case-group {
        /* Needs to clear the widest case shape's own right edge (the "cut"
           shape now reaches x=60) plus its leftmost point, so it's fully
           off-canvas regardless of which shape is selected. */
        transform: translateX(-66px);
      }
      /* Rotation itself is driven from JS (main.ts), not CSS animation, so
         the disc can freeze exactly where it stopped and pick back up from
         there instead of resetting to 0deg on every toggle. */
      #pet-disc-group {
        transform-origin: 39px 24px;
      }
    </style>
  </head>
  <body>
    <!-- markup injected from shared/petSvg.ts by main.ts, so the artwork
         has a single source of truth shared with the window/tray icon -->
    <div id="pet-root"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
